<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <dir prefix="cwd">assets/fonts</dir>
    <cachedir>/tmp/fc-cache</cachedir>
    <config>
        <rescan>
            <int>30</int>
        </rescan>
    </config>
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Inter</family>
        </prefer>
    </alias>
</fontconfig>

