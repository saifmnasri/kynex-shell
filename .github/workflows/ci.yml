name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git and ca-certificates in container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify git repository context
        run: |
          git rev-parse HEAD
          git rev-parse --is-inside-work-tree
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git merge-base HEAD origin/${{ github.base_ref }}
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            git merge-base HEAD HEAD~1
          fi

      - name: Bootstrap system packages
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo ./scripts/bootstrap-system.sh
          else
            ./scripts/bootstrap-system.sh
          fi

      - name: Cache cargo binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-user.sh') }}

      - name: Bootstrap user tools
        run: |
          ./scripts/bootstrap-user.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run verification gate
        run: |
          source "$HOME/.cargo/env"
          STRICT=1 ./scripts/verify.sh --ci

      - name: Upload visual regression artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: visual-regression-failures
          path: tests/visual/failures/
          if-no-files-found: ignore

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
