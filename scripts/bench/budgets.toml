# Machine-readable performance budgets for Kynex Shell.
# Methodology and baseline definitions: performance benchmarks

[session_idle_pss]
name = "Complete session idle memory (PSS)"
target = "<= 60% of Plasma and GNOME"
gnome_baseline_mb = 154.8
ratio_ceiling = 0.60
unit = "MB"

[idle_cpu]
name = "Idle CPU (60 s average)"
target = "< 0.5% of one core, no wakeups without events"
max_cpu_pct = 0.50
unit = "%"

[first_frame_time]
name = "Time from compositor ready to first shell frame"
target = "< 1.0 s"
max_ms = 1000.0
unit = "ms"

[launcher_open_latency_cold]
name = "Launcher: key press -> first visible frame (cold)"
target = "< 50 ms (p95)"
max_ms = 50.0
unit = "ms"
phase = "Phase 4"

[launcher_open_latency_warm]
name = "Launcher: key press -> first visible frame (warm)"
target = "< 16 ms (p95)"
max_ms = 16.0
unit = "ms"
phase = "Phase 4"

[search_keystroke_latency]
name = "Search results update per keystroke"
target = "< 16 ms for 5,000 apps/files indexed"
max_ms = 16.0
unit = "ms"
phase = "Phase 4"

[apps_index_cold_scan]
name = "Apps index cold scan (5,000 entries)"
target = "< 500 ms"
max_ms = 500.0
unit = "ms"
phase = "Phase 4"

[apps_index_incremental_update]
name = "Apps index incremental update"
target = "< 50 ms"
max_ms = 50.0
unit = "ms"
phase = "Phase 4"

[apps_index_daemon_pss]
name = "Daemon PSS with 5,000 entries"
target = "< 15 MB PSS"
max_pss_mb = 15.0
unit = "MB"
phase = "Phase 4"

[taskbar_update_latency]
name = "Taskbar update after window open/close"
target = "< 50 ms"
max_ms = 50.0
unit = "ms"
phase = "Phase 3"

[ui_frame_time]
name = "UI frame time in our windows"
target = "p99 < 8.3 ms at 120 Hz (< 16.6 ms at 60 Hz)"
max_ms_120hz = 8.3
unit = "ms"
hardware_gpu_required = true

[notification_latency]
name = "Notification popup: D-Bus call -> visible"
target = "< 50 ms"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[notification_latency_warm]
name = "Notification popup latency (warm)"
target = "< 50 ms (p95)"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[notifications_history_daemon_pss]
name = "Daemon PSS with 200 notifications history"
target = "< 15 MB PSS"
max_pss_mb = 15.0
unit = "MB"
phase = "Phase 5"

[notifications_flood_cpu]
name = "Notifications flood CPU"
target = "< 20% during flood"
max_cpu_pct = 20.0
unit = "%"
phase = "Phase 5"

[daemon_resident_memory]
name = "Daemon resident memory"
target = "< 10 MB PSS (< 40 MB RSS)"
max_pss_mb = 10.0
max_rss_mb = 40.0
unit = "MB"

[icon_lookup_cold]
name = "Icon lookup latency (cold)"
target = "< 10 ms (p95)"
max_ms = 10.0
unit = "ms"
phase = "Phase 4"

[icon_lookup_warm]
name = "Icon lookup latency (warm / cached)"
target = "< 1 ms (p95)"
max_ms = 1.0
unit = "ms"
phase = "Phase 4"

[binary_size]
name = "Binary/install size of shell"
target = "Track per release, no unexplained growth > 10%"
unit = "MB"
max_growth_pct = 10.0

[tray_item_registration_latency_cold]
name = "Tray: item registration -> first visible frame (cold)"
target = "< 50 ms (p95)"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[tray_item_registration_latency_warm]
name = "Tray: item registration -> first visible frame (warm)"
target = "< 16 ms (p95)"
max_ms = 16.0
unit = "ms"
phase = "Phase 5"

[tray_idle_daemon_pss]
name = "Daemon PSS with 20 tray items and 1,000 register/unregister plateau"
target = "< 15 MB PSS"
max_pss_mb = 15.0
unit = "MB"
phase = "Phase 5"

[tray_flood_cpu]
name = "Tray: 10,000-signal flood CPU"
target = "< 20% during flood"
max_cpu_pct = 20.0
unit = "%"
phase = "Phase 5"

[menu_open_latency_cold]
name = "Tray menu: right-click -> first visible frame (cold)"
target = "< 50 ms (p95)"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[menu_open_latency_warm]
name = "Tray menu: right-click -> first visible frame (warm)"
target = "< 50 ms (p95)"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[menu_500_items_latency]
name = "Tray menu: 500-item menu parse & first frame latency"
target = "< 50 ms"
max_ms = 50.0
unit = "ms"
phase = "Phase 5"

[menu_idle_daemon_pss]
name = "Daemon PSS after 100 menu open/close cycles plateau"
target = "< 15 MB PSS"
max_pss_mb = 15.0
unit = "MB"
phase = "Phase 5"

[menu_idle_shell_pss]
name = "Shell PSS after 100 menu open/close cycles plateau"
target = "< 100 MB PSS in VM llvmpipe (< 50 MB on hardware)"
max_pss_mb = 100.0
unit = "MB"
phase = "Phase 5"

[menu_flood_cpu]
name = "Tray menu: 10,000 LayoutUpdated flood CPU"
target = "< 20% during flood"
max_cpu_pct = 20.0
unit = "%"
phase = "Phase 5"


