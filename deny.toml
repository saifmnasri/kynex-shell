# cargo-deny policy. Verify keys against your installed version: `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []   # every ignore needs a comment with reason + expiry

[licenses]
version = 2
# Third-party dependencies: prefer MIT/BSD/Apache-style and must be GPL-3.0-compatible.
# All licenses not in the allow list below (including GPL-2.0-only) are strictly denied.
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD",
  "Unicode-3.0", "CC0-1.0", "BSL-1.0", "MPL-2.0",
]
confidence-threshold = 0.9

# Our workspace crates are GPL-3.0-or-later and publish = false.
# Skip license checks on private (unpublished) crates so the allow list
# above enforces permissive-only on actual third-party dependencies.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
