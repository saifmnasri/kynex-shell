[package]
name = "kynex-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "allow" # Justification: Required for cxx / cxx-qt FFI interop with C++ and Qt
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
module_name_repetitions = "allow"
unnecessary_box_returns = "allow" # Generated by cxx-qt::bridge macros

[dependencies]
chrono = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
kynex-common = { workspace = true }
kynex-ipc = { workspace = true }
kynex-style = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zbus = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }
pkg-config = "0.3"
