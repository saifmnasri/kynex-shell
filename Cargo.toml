[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Saifeddine Mnasri <saif.mnasri@gmail.com>"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"
module_name_repetitions = "allow"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cxx = "1.0"
cxx-qt = "=0.10.0"
cxx-qt-build = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service", "tracing"] }

kynex-common = { path = "crates/kynex-common", version = "0.1.0" }
kynex-icons = { path = "crates/kynex-icons", version = "0.1.0" }
kynex-ipc = { path = "crates/kynex-ipc", version = "0.1.0" }
kynex-notifications = { path = "crates/kynex-notifications", version = "0.1.0" }
kynex-shell-core = { path = "crates/kynex-shell-core", version = "0.1.0" }
kynex-style = { path = "crates/kynex-style", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
strip = "none"
debug = true
panic = "unwind"
